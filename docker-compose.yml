services:

  # ======= Nginx — البوابة الرئيسية =======
  nginx:
    image: nginx:alpine
    container_name: hpc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
      - keycloak
    networks:
      - frontend_network
      - proxy_network

  # ======= FastAPI — الـ Backend =======
  fastapi:
    build: ./backend
    container_name: hpc-fastapi
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - postgres
    networks:
      - proxy_network
      - backend_network

  # ======= Keycloak — المصادقة =======
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: hpc-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hpc_portal
      KC_DB_USERNAME: hpcuser
      KC_DB_PASSWORD: ***REMOVED***
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ***REMOVED***
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    expose:
      - "8080"        # ← بدل ports، expose فقط داخلي!
    depends_on:
      - postgres
    networks:
      - proxy_network
      - backend_network

  # ======= PostgreSQL — قاعدة البيانات =======
  postgres:
    image: postgres:16
    container_name: hpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hpcuser
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: hpc_portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"        # ← داخلي فقط، مش مفتوح للخارج!
    networks:
      - backend_network   # ← postgres يراه FastAPI وKeycloak فقط!

# ======= الشبكات المعزولة =======
networks:
  frontend_network:
    driver: bridge    # المستخدم ← Nginx فقط
  proxy_network:
    driver: bridge    # Nginx ← FastAPI + Keycloak
  backend_network:
    driver: bridge    # FastAPI + Keycloak ← Postgres فقط

volumes:
  postgres-data:
