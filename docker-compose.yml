services:

  postgres:
    image: postgres:16
    container_name: hpc-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: hpcuser
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: hpc_portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpcuser -d hpc_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hpc-net

  mailhog:
    image: mailhog/mailhog
    container_name: hpc-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - hpc-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: hpc-keycloak
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hpc-postgres:5432/hpc_portal
      KC_DB_USERNAME: hpcuser
      KC_DB_PASSWORD: ***REMOVED***
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ***REMOVED***
      KC_HOSTNAME: localhost
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
      KC_HTTP_ENABLED: "false"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./certs/server.crt:/opt/keycloak/conf/server.crt:ro
      - ./certs/server.key:/opt/keycloak/conf/server.key:ro
    command: start-dev --https-port=8443
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hpc-net

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    container_name: hpc-fastapi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./certs:/app/certs:ro 
      - audit-anchors:/app/audit_anchors
      - ./uploads:/app/uploads:rw
    command: >
      sh -c "pip install uvicorn fastapi && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --ssl-keyfile /app/certs/fastapi.key --ssl-certfile /app/certs/fastapi.crt"
    expose:
      - "8000"
    
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - hpc-net

  frontend:
    build: ./frontend
    container_name: hpc-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
     
      keycloak:
        condition: service_healthy
    networks:
      - hpc-net

  nginx:
    image: nginx:alpine
    container_name: hpc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
     
      keycloak:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - hpc-net

networks:
  hpc-net:
    driver: bridge

volumes:
  postgres-data:
  audit-anchors:
