version: '3.8'

services:
  # 1. قاعدة البيانات (PostgreSQL) - معزولة تماماً داخل الشبكة
  postgres:
    image: postgres:16
    container_name: hpc-postgres
    environment:
      POSTGRES_USER: asma_user
      POSTGRES_PASSWORD: asma_password
      POSTGRES_DB: hpc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hpc-net
    # ملاحظة: لا توجد Ports هنا للأمان (Day 12-13)

  # 2. الباك-إند (FastAPI) - يعمل خلف Nginx فقط
  fastapi:
    image: hpc-portal-fastapi
    container_name: hpc-fastapi
    environment:
      DATABASE_URL: postgresql://asma_user:asma_password@postgres/hpc_db
    volumes:
      - ./backend:/app          # ربط المجلد المباشر (لإصلاح مشكلة dotenv)
      - ./certs:/app/certs:ro   # شهادات الـ SSL
    networks:
      - hpc-net
    depends_on:
      - postgres
    # ملاحظة: لا توجد Ports هنا، الوصول يتم عبر Nginx فقط

  # 3. نظام الهوية (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: hpc-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8443:8443"
    networks:
      - hpc-net
    depends_on:
      - postgres

  # 4. الـ Proxy (Nginx) - البوابة الوحيدة المفتوحة للعالم الخارجي
  nginx:
    image: nginx:alpine
    container_name: hpc-nginx
    ports:
      - "80:80"   # للتحويل التلقائي (Redirect)
      - "443:443" # المنفذ الرئيسي المشفر
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - hpc-net
    depends_on:
      - fastapi

networks:
  hpc-net:
    driver: bridge

volumes:
  postgres_data:
