services:
  # 1. قاعدة البيانات (Postgres)
  postgres:
    image: postgres:16
    container_name: hpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hpcuser
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: hpc_portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpcuser -d hpc_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hpc-net

  # 2. نظام التحقق من الهوية (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: hpc-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hpc-postgres:5432/hpc_portal
      KC_DB_USERNAME: hpcuser
      KC_DB_PASSWORD: ***REMOVED***
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ***REMOVED***
      KC_HOSTNAME: localhost
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
      KC_HTTP_ENABLED: "false"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./certs/server.crt:/opt/keycloak/conf/server.crt:ro
      - ./certs/server.key:/opt/keycloak/conf/server.key:ro
    command: start-dev
    ports:
      - "8443:8443"
    healthcheck:
      # اختبار إذا كان Keycloak يستجيب على بورت HTTPS
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"HTTP/1.1 200 OK\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hpc-net

  # 3. التطبيق (FastAPI Backend)
  fastapi:
    build: ./backend
    container_name: hpc-fastapi
    restart: unless-stopped
    volumes:
      - ./certs:/app/certs:ro
    # ملاحظة: تأكدي أن مسار الشهادات في الـ command مطابق لمكانها في الـ container
    command: >
      sh -c "pip install uvicorn fastapi && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --ssl-keyfile /app/certs/server.key --ssl-certfile /app/certs/server.crt"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - hpc-net

  # 4. بوابة الدخول (Nginx Proxy)
  nginx:
    image: nginx:alpine
    container_name: hpc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      fastapi:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - hpc-net

networks:
  hpc-net:
    driver: bridge

volumes:
  postgres-data:
