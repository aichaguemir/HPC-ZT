# إعداد تحديد معدل الطلبات (Day 4-6)
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=100r/m;

server {
    listen 443 ssl;
    server_name localhost;

    # شهادات TLS 1.3 (Day 7-9)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.3; 

    # رؤوس الأمان (Day 4-6)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # 1. تطبيق الـ Rate Limiting
        limit_req zone=mylimit burst=20 nodelay;

        # 2. التحقق من وجود التوكن (Day 10-11)
        # إذا لم يوجد Header باسم Authorization، ارجع خطأ 401
        if ($http_authorization = "") {
            return 401 '{"error": "Authorization token missing"}';
        }

        proxy_pass http://hpc-fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
}

# تحويل من HTTP إلى HTTPS (Day 8)
server {
    listen 80;
    return 301 https://$host$request_uri;
}
