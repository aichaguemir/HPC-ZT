k# Rate Limiting
limit_req_zone $binary_remote_addr zone=portal:10m rate=100r/m;

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    limit_req zone=portal burst=30 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ====================== API Routes (Proxy to FastAPI) ======================
    location /api/ {
        # Token Check
        if ($http_authorization = "") {
            return 401 '{"error":"Authorization header required"}';
        }

        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root page
    location / {
        return 200 '{"message":"HPC Portal is running!","status":"ok"}';
        add_header Content-Type application/json;
    }
}
