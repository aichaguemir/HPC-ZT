
# HTTP → HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS الرئيسي
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.3;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # حجب المشبوهين
    if ($blocked_agent) {
        return 403 "Forbidden";
    }

    # API — يحتاج JWT Token
    location /api/ {
        if ($http_authorization = "") {
            return 401 '{"error":"Authorization header required"}';
        }
        limit_req zone=portal burst=20 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # Keycloak — تسجيل الدخول
    location /auth/ {
        limit_req zone=portal burst=10 nodelay;
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend — الصفحة الرئيسية
    location / {
        limit_req zone=portal burst=50 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }
}
